<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkedIn Automation POC</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #17202a;
        background: #f4f6f8;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 26px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 20px;
        color: #52616f;
      }

      form,
      .status {
        background: #ffffff;
        border: 1px solid #d9e0e7;
        border-radius: 8px;
        padding: 18px;
      }

      form + form {
        margin-top: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 650;
      }

      input[type="text"],
      input[type="number"],
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #c6d0da;
        border-radius: 6px;
        padding: 12px;
        font: inherit;
        line-height: 1.45;
      }

      textarea {
        min-height: 180px;
        resize: vertical;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 14px;
      }

      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: #0a66c2;
        color: white;
        font: inherit;
        font-weight: 700;
        padding: 10px 16px;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .status {
        margin-top: 18px;
      }

      pre {
        margin: 12px 0 0;
        white-space: pre-wrap;
        word-break: break-word;
        background: #111827;
        color: #e5e7eb;
        border-radius: 6px;
        padding: 12px;
        min-height: 96px;
      }

      .results {
        display: grid;
        gap: 12px;
        margin-top: 14px;
      }

      .result {
        border: 1px solid #d9e0e7;
        border-radius: 8px;
        padding: 12px;
        background: #ffffff;
      }

      .result strong {
        display: block;
        margin-bottom: 4px;
      }

      .result h3 {
        margin: 12px 0 6px;
        font-size: 15px;
      }

      .result ul {
        margin: 6px 0 0;
        padding-left: 20px;
      }

      .draft {
        border-left: 3px solid #0a66c2;
        margin-top: 8px;
        padding: 8px 10px;
        background: #f4f8fc;
      }

      .secondary {
        background: #eef2f6;
        color: #17202a;
      }

      .muted {
        color: #64707d;
        font-size: 14px;
      }

      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .row {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LinkedIn Automation POC</h1>
      <p>Run simple and long-running LinkedIn browser tasks without typing CLI commands.</p>

      <form id="post-form">
        <h2>Post Task</h2>
        <label for="post-text">Post text</label>
        <textarea id="post-text">AI is useful only when it moves from demos to real workflows.

Lately I have been exploring how AI agents can work with browser automation to handle repetitive web tasks: searching, inspecting pages, drafting messages, checking results, and keeping a human approval step before anything important happens.

The interesting part is not just making the agent click buttons. It is making the workflow reliable, reviewable, and safe enough that a person can trust it.</textarea>

        <div class="row">
          <label class="check">
            <input id="publish" type="checkbox" />
            Publish immediately
          </label>
          <button id="run" type="submit">Run LinkedIn Task</button>
        </div>
      </form>

      <form id="outreach-form">
        <h2>Long-Running Outreach Draft Task</h2>
        <div class="grid">
          <div>
            <label for="query">People search</label>
            <input id="query" type="text" value="AI engineer India" />
          </div>
          <div>
            <label for="limit">Profiles to process</label>
            <input id="limit" type="number" min="1" max="10" value="5" />
          </div>
          <div>
            <label for="goal">Outreach goal</label>
            <input
              id="goal"
              type="text"
              value="browser automation and AI agent workflow help"
            />
          </div>
          <div>
            <label for="tone">Tone</label>
            <select id="tone">
              <option value="casual">Casual</option>
              <option value="professional">Professional</option>
            </select>
          </div>
        </div>
        <div class="row">
          <span class="muted">Draft-only. This does not send DMs or connection requests.</span>
          <button id="run-outreach" type="submit">Start Long Task</button>
        </div>
      </form>

      <form id="profile-comment-form">
        <h2>Profile Post Comment Task</h2>
        <div class="grid">
          <div>
            <label for="profile-url">LinkedIn profile URL</label>
            <input
              id="profile-url"
              type="text"
              value="https://www.linkedin.com/in/soumyapanda12/"
            />
          </div>
          <div>
            <label for="post-limit">Posts to analyze</label>
            <input id="post-limit" type="number" min="1" max="5" value="2" />
          </div>
          <div>
            <label for="comment-tone">Comment tone</label>
            <select id="comment-tone">
              <option value="casual">Casual</option>
              <option value="professional">Professional</option>
            </select>
          </div>
        </div>
        <div class="row">
          <label class="check">
            <input id="publish-comments" type="checkbox" />
            Post comments immediately
          </label>
          <button id="run-profile-comments" type="submit">Analyze Profile Posts</button>
        </div>
      </form>

      <section class="status">
        <strong id="state">Idle</strong>
        <pre id="output">No job started.</pre>
        <div id="results" class="results"></div>
      </section>
    </main>

    <script>
      const form = document.querySelector("#post-form");
      const text = document.querySelector("#post-text");
      const publish = document.querySelector("#publish");
      const run = document.querySelector("#run");
      const outreachForm = document.querySelector("#outreach-form");
      const query = document.querySelector("#query");
      const limit = document.querySelector("#limit");
      const goal = document.querySelector("#goal");
      const tone = document.querySelector("#tone");
      const runOutreach = document.querySelector("#run-outreach");
      const profileCommentForm = document.querySelector("#profile-comment-form");
      const profileUrl = document.querySelector("#profile-url");
      const postLimit = document.querySelector("#post-limit");
      const commentTone = document.querySelector("#comment-tone");
      const publishComments = document.querySelector("#publish-comments");
      const runProfileComments = document.querySelector("#run-profile-comments");
      const state = document.querySelector("#state");
      const output = document.querySelector("#output");
      const results = document.querySelector("#results");

      function renderResults(job) {
        results.innerHTML = "";
        if (!Array.isArray(job.results) || job.results.length === 0) return;
        for (const result of job.results) {
          const article = document.createElement("article");
          article.className = "result";
          if (job.type === "profile-comments") {
            const signals = result.analysis?.signals || [];
            const topics = result.analysis?.topics || [];
            const draft = result.commentDraft || "";
            article.innerHTML = `
              <strong>Post ${result.status ? `- ${result.status}` : ""}</strong>
              <div class="muted"><a href="${result.postUrl}" target="_blank" rel="noreferrer">Open post</a></div>
              <h3>Post analysis</h3>
              <p>${result.analysis?.summary || "Post text was analyzed."}</p>
              <div class="muted">Topics: ${topics.join(", ") || "not enough data"}</div>
              <ul>${signals.map((signal) => `<li>${signal}</li>`).join("")}</ul>
              <h3>Comment</h3>
              <div class="draft">${draft}</div>
              <button class="secondary" type="button">Copy comment</button>
            `;
            article.querySelector("button").addEventListener("click", async () => {
              await navigator.clipboard.writeText(draft);
            });
            results.append(article);
            continue;
          }

          const signals = result.analysis?.signals || result.evidence || [];
          const topics = result.analysis?.topics || [];
          const draft = result.dmDraft || result.draft || "";
          article.innerHTML = `
            <strong>${result.headline || "LinkedIn result"}</strong>
            <div class="muted">${result.location || "Location not visible"}</div>
            <h3>Analysis</h3>
            <p>${result.analysis?.summary || "Only visible search text was available."}</p>
            <div class="muted">Topics: ${topics.join(", ") || "not enough data"}</div>
            <ul>${signals.map((signal) => `<li>${signal}</li>`).join("")}</ul>
            <h3>DM draft</h3>
            <div class="draft">${draft}</div>
            <p class="muted">${result.analysis?.limitations || ""}</p>
            <p class="muted">${result.nextAction || ""}</p>
            <button class="secondary" type="button">Copy DM draft</button>
          `;
          article.querySelector("button").addEventListener("click", async () => {
            await navigator.clipboard.writeText(draft);
          });
          results.append(article);
        }
      }

      async function pollJob(id) {
        const response = await fetch(`/api/jobs/${id}`);
        const job = await response.json();
        const progress = job.progress
          ? ` ${job.progress.processed}/${job.progress.total}`
          : "";
        state.textContent = `${job.status}${progress} (${job.session})`;
        output.textContent = job.output || "Starting browser task...";
        renderResults(job);
        if (job.status === "running") {
          window.setTimeout(() => pollJob(id), 1500);
        } else {
          run.disabled = false;
          runOutreach.disabled = false;
          runProfileComments.disabled = false;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        run.disabled = true;
        runOutreach.disabled = true;
        runProfileComments.disabled = true;
        state.textContent = "starting";
        output.textContent = "Creating job...";
        results.innerHTML = "";

        const response = await fetch("/api/jobs", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            text: text.value,
            publish: publish.checked,
          }),
        });
        const job = await response.json();
        if (!response.ok) {
          state.textContent = "failed";
          output.textContent = job.error || "Failed to start job.";
          run.disabled = false;
          runProfileComments.disabled = false;
          return;
        }
        pollJob(job.id);
      });

      outreachForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        run.disabled = true;
        runOutreach.disabled = true;
        runProfileComments.disabled = true;
        state.textContent = "starting";
        output.textContent = "Creating long-running job...";
        results.innerHTML = "";

        const response = await fetch("/api/outreach-jobs", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            query: query.value,
            limit: limit.value,
            goal: goal.value,
            tone: tone.value,
          }),
        });
        const job = await response.json();
        if (!response.ok) {
          state.textContent = "failed";
          output.textContent = job.error || "Failed to start job.";
          run.disabled = false;
          runOutreach.disabled = false;
          runProfileComments.disabled = false;
          return;
        }
        pollJob(job.id);
      });

      profileCommentForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        run.disabled = true;
        runOutreach.disabled = true;
        runProfileComments.disabled = true;
        state.textContent = "starting";
        output.textContent = "Creating profile comment job...";
        results.innerHTML = "";

        const response = await fetch("/api/profile-comment-jobs", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            profileUrl: profileUrl.value,
            limit: postLimit.value,
            tone: commentTone.value,
            publishComments: publishComments.checked,
          }),
        });
        const job = await response.json();
        if (!response.ok) {
          state.textContent = "failed";
          output.textContent = job.error || "Failed to start job.";
          run.disabled = false;
          runOutreach.disabled = false;
          runProfileComments.disabled = false;
          return;
        }
        pollJob(job.id);
      });
    </script>
  </body>
</html>
